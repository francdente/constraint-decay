services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=conduit
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    networks: [realworld]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d conduit -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  conduit:
    build: .
    image: apibench/express
    tty: true
    networks: [realworld]
    depends_on:
      postgres:
        condition: service_healthy

  newman:
    build: ../newman
    image: apibench/newman
    tty: true
    networks: [realworld]
    depends_on:
      conduit:
        condition: service_started

networks:
  realworld: {}